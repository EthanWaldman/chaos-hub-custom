apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: sleep-delay-
  namespace: litmus
spec:
  entrypoint: run-delay
  serviceAccountName: argo-chaos
  arguments:
    parameters:
    - name: delaySeconds
      value: "5"

  templates:
  - name: run-delay
    steps:
    - - name: sleep
        template: sleep-step

  - name: sleep-step
    container:
      image: alpine:3.20
      command: ["sh", "-c"]
      args:
      - |
        echo "Sleeping for {{workflow.parameters.delaySeconds}} seconds"
        sleep {{workflow.parameters.delaySeconds}}
        echo "Done"

